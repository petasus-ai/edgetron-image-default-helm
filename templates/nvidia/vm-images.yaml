{{ if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    acceleratorType: nvidia
    description: Ubuntu 24.04 Image
    isImage: "true"
    imageType: "generic"
    osType: "linux"
    distroType: "ubuntu"
    bootType: "uefi"
    archType: "x86_64"
  name: ubuntu-2404-image-nvidia-{{ $.Values.image.accelerator.nvidia.version }}-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 48Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      {{- if .Values.image.registry }}
      url: docker://{{ $.Values.image.registry }}/quay.io/edgestack/ubuntu-2404-container-disk:nvidia_{{ $.Values.image.accelerator.nvidia.version }}_full_x86_64
      {{- else }}
      url: docker://quay.io/edgestack/ubuntu-2404-container-disk:nvidia_{{ $.Values.image.accelerator.nvidia.version }}_full_x86_64
      {{- end}}
      pullMethod: {{ $.Values.pullMethod }}
{{ end }}

