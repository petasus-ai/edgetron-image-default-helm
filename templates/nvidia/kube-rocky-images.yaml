{{- if .Values.image.accelerator.nvidia.enable }}
{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
{{- range .Values.image.kubernetes.rocky }}
{{- $kubeVersion := required (printf "kubeVersions: no full version defined for Kubernetes %s" .) (index $.Values.kubeVersions .) }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Rocky 9 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    doca: "true"
    kubeVersion: {{ $kubeVersion }}
    osDistro: rocky-9
    bootType: uefi
    archType: x86_64
  name: rocky-9-{{ $kubeVersion }}-doca-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      {{- if $.Values.image.registry }}
      url: docker://{{ $.Values.image.registry }}/quay.io/edgestack/rocky-9-uefi-kube:{{ $kubeVersion }}-doca-amd64
      {{- else }}
      url: docker://quay.io/edgestack/rocky-9-uefi-kube:{{ $kubeVersion }}-doca-amd64
      {{- end}}
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}

{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "arm64") }}
{{- range .Values.image.kubernetes.rocky }}
{{- $kubeVersion := required (printf "kubeVersions: no full version defined for Kubernetes %s" .) (index $.Values.kubeVersions .) }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Rocky 9 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    doca: "true"
    kubeVersion: {{ $kubeVersion }}
    osDistro: rocky-9
    bootType: uefi
    archType: aarch64
  name: rocky-9-{{ $kubeVersion }}-doca-arm64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      {{- if $.Values.image.registry }}
      url: docker://{{ $.Values.image.registry }}/quay.io/edgestack/rocky-9-uefi-kube:{{ $kubeVersion }}-doca-aarch64
      {{- else }}
      url: docker://quay.io/edgestack/rocky-9-uefi-kube:{{ $kubeVersion }}-doca-aarch64
      {{- end}}
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}
{{- end }}
