{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
{{- range .Values.image.kubernetes.rocky }}
{{- if eq . "1.23" }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Rocky 8 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    kubeVersion: v1.23.13
    osDistro: rocky-8
    bootType: uefi
    archType: x86_64
  name: rocky-8-v1.23.13-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 11Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/rocky-8-uefi-kube:v1.23.13-amd64
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}
{{- end }}

