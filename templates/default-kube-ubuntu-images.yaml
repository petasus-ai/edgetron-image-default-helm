{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
{{- range .Values.image.kubernetes.ubuntu }}
{{- if eq . "1.23" }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Ubuntu 2004 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    kubeVersion: v1.23.13
    osDistro: ubuntu-2004
    bootType: legacy
    archType: x86_64
  name: ubuntu-2004-v1.23.13-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 11Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/ubuntu-2004-kube:v1.23.13-amd64
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}
{{- end }}

