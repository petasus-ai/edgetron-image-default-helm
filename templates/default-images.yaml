---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: CentOS 7 Image
    isImage: "true"
    imageType: "generic"
  name: centos-7-image
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 12Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/centos-7-container-disk:latest
      pullMethod: {{ $.Values.pullMethod }}

{{ if .Values.image.realtime }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: CentOS 7 Image with Realtime Kernel
    isImage: "true"
    imageType: "generic"
  name: centos-7-rt-image
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 12Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/centos-7-container-disk:rt
      pullMethod: {{ $.Values.pullMethod }}
{{ end }}

