{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
{{- range .Values.image.kubernetes.ubuntu }}
{{- $kubeVersion := required (printf "kubeVersions: no full version defined for Kubernetes %s" .) (index $.Values.kubeVersions .) }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Ubuntu 2404 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    doca: "false"
    kubeVersion: {{ $kubeVersion }}
    osDistro: ubuntu-2404
    bootType: uefi
    archType: x86_64
  name: ubuntu-2404-{{ $kubeVersion }}-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      {{- if $.Values.image.registry }}
      url: docker://{{ $.Values.image.registry }}/quay.io/edgestack/ubuntu-2404-kube:{{ $kubeVersion }}-amd64
      {{- else }}
      url: docker://quay.io/edgestack/ubuntu-2404-kube:{{ $kubeVersion }}-amd64
      {{- end}}
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}

{{- if or (eq .Values.archType "multiarch") (eq .Values.archType "arm64") }}
{{- range .Values.image.kubernetes.ubuntu }}
{{- $kubeVersion := required (printf "kubeVersions: no full version defined for Kubernetes %s" .) (index $.Values.kubeVersions .) }}
