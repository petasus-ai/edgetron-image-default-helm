---
{{- range .Values.image.kubernetes.ubuntu }}
{{- if eq . "1.23" }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: Ubuntu 2004 Image with Kubernetes Pre-installed
    imageType: k8s
    isImage: "true"
    kubeVersion: v1.23.13
    osDistro: ubuntu-2004
    bootType: legacy
    archType: multiarch
  name: ubuntu-2004-v1.23.13
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 11Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/ubuntu-2004-kube:v1.23.13
      pullMethod: {{ $.Values.pullMethod }}
{{- end }}
{{- end }}

