{{ if or (eq .Values.archType "multiarch") (eq .Values.archType "amd64") }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    description: CentOS 7 Image
    isImage: "true"
    imageType: "generic"
    osType: "linux"
    distroType: "centos"
    bootType: "legacy"
    archType: "x86_64"
  name: centos-7-image-amd64
  namespace: imagevolume
spec:
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 12Gi
    storageClassName: {{ $.Values.storageClass }}
  source:
    registry:
      url: docker://quay.io/edgestack/centos-7-container-disk:7.9-x86_64
      pullMethod: {{ $.Values.pullMethod }}
{{ end }}

